<!DOCTYPE html>
<html lang="ko">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>김현주 | 자기소개</title>
</head>

<body>
    <div class="container">
        <!--이름 + 한줄소개-->
        <header>
            <h1>김현주</h1>
            <p>다양한 경험을 쌓는 중인 초보 개발자</p>
        </header>

        <main>
            <!--자기소개-->
            <section class="profile">
                <!--깃허브 프로필 이미지 사용했습니다-->>
                <img src="https://avatars.githubusercontent.com/u/273074868?v=4" alt="프로필 이미지">
                <div>
                    <h2>소개</h2>

            <section>

                <ul>
                    <li>웹 및 앱 개발</li>
                    <li>영화 감상</li>
                    <li>게임</li>
                </ul>
            </section>

            <section>
                <h2>배우고 싶은 것</h2>
                <p>웹이나 앱 서비스 개발의 기획부터 배포까지 전체적인 프로젝트 진행 과정과 코딩 경험을 쌓고 싶습니다</p>
            </section>

        </main>

        <!--깃허브 링크 + 제작자 정보-->
        <footer>
            <a href="https://github.com/HyunJo-o" target="_blank">github 방문하기</a>
            <p>만든 사람 : 김현주</p>
